name: SnapRead
options:
  bundleIdPrefix: org.cantoni
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

targets:
  SnapRead:
    type: application
    platform: macOS
    sources:
      - path: SnapRead
    info:
      path: Support/Info.plist
      properties:
        NSPhotoLibraryUsageDescription: SnapRead scans your recent iPhone screenshots so you can review them, act on their links, and clean them up.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: SnapRead
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: Support/SnapRead.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.photos-library: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.cantoni.SnapRead
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
        MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  SnapRead:
    build:
      targets:
        SnapRead: all
    run:
      config: Debug
